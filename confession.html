<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fdecef">
    <title>可以成为我的恋人吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #fdecef;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
            padding: 40px 20px;
            transition: opacity 0.6s ease;
            z-index: 10;
        }

        #success {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .character {
            width: 200px;
            max-width: 55%;
            height: auto;
            object-fit: contain;
            animation: floatChar 3s ease-in-out infinite;
            position: relative;
            z-index: 15;
        }

        @keyframes floatChar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: clamp(20px, 5.5vw, 30px);
            font-weight: bold;
            margin: 24px 0;
            color: #8b6568;
            text-align: center;
            line-height: 1.5;
            word-break: keep-all;
            position: relative;
            z-index: 15;
        }

        .btn-box {
            position: relative;
            z-index: 15;
            width: 100%;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        #yesBtn {
            width: 180px;
            height: 70px;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff8ca8, #ffa5bb);
            color: #fff;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(255, 140, 168, 0.5);
            transition: all 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
            -webkit-appearance: none;
        }

        #yesBtn:active {
            transform: scale(0.95);
        }

        #noBtn {
            padding: 10px 20px;
            background: #7ea4ff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            max-width: 60vw;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-appearance: none;
        }

        #noBtn:active {
            transform: scale(0.92);
        }

        #noBtn.hidden {
            display: none !important;
        }

        /* ===== 成功页 ===== */
        .top-heart {
            font-size: 36px;
            animation: heartBeat 1.2s ease-in-out infinite;
            margin-bottom: 8px;
            position: relative;
            z-index: 15;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        #success h1 {
            font-size: clamp(28px, 8vw, 42px);
            background: linear-gradient(135deg, #ff2d55, #ff6b81, #ff4757);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite, lovePulse 2s ease-in-out infinite;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.5;
            filter: drop-shadow(0 2px 8px rgba(255, 45, 85, 0.3));
            position: relative;
            z-index: 15;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes lovePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .couple-img {
            width: 260px;
            max-width: 72%;
            height: auto;
            object-fit: contain;
            animation: coupleBounce 2s ease-in-out infinite;
            position: relative;
            z-index: 15;
        }

        @keyframes coupleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== 爱心飘落（z-index 最低，在图片后面） ===== */
        .heart {
            position: fixed;
            pointer-events: none;
            animation: floatUp linear forwards;
            z-index: 1;
        }

        .heart.pink {
            color: rgba(255, 180, 195, 0.4);
        }

        .heart.red {
            filter: drop-shadow(0 0 8px rgba(255, 50, 70, 0.6));
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            8%   { opacity: 1; transform: translateY(-8vh) rotate(30deg) scale(1); }
            50%  { transform: translateY(-50vh) rotate(180deg) scale(1.05); }
            92%  { opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        @media (max-width: 375px) {
            .title { font-size: 18px; }
            #yesBtn { width: 150px; height: 60px; font-size: 20px; }
            #noBtn { font-size: 14px; }
            #success h1 { font-size: 24px; }
        }
    </style>
</head>

<body>

    <!-- 背景音乐（本地文件，点击同意后自动播放） -->
    <audio id="bgMusic" loop preload="auto" style="display:none">
        <source src="./bgm.ogg" type="audio/ogg">
    </audio>

    <div id="main" class="page">


        <img class="character" src="./1.png" alt="角色" draggable="false">

        <div class="title" id="titleText">可以成为我的恋人吗？</div>

        <div class="btn-box" id="btnBox">
            <button id="yesBtn">可以</button>
            <button id="noBtn">不可以</button>
        </div>
    </div>

    <div id="success" class="page">
        <div class="top-heart">❤️</div>
        <h1>!!!喜欢你!!! (╰>ᴗ—)</h1>
        <img class="couple-img" src="./2.png" alt="贴贴情侣" draggable="false">
    </div>

    <script>
    (function () {
        var bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.7;

        // ===== 播放背景音乐 =====
        function playMusic() {
            var p = bgMusic.play();
            if (p) p.catch(function () {
                document.addEventListener('click', function r() {
                    bgMusic.play();
                    document.removeEventListener('click', r);
                }, { once: true });
                document.addEventListener('touchend', function r2() {
                    bgMusic.play();
                    document.removeEventListener('touchend', r2);
                }, { once: true });
            });
        }

        // ===== 按钮逻辑 =====
        var yesBtn = document.getElementById('yesBtn');
        var noBtn = document.getElementById('noBtn');
        var mainPage = document.getElementById('main');
        var successPage = document.getElementById('success');
        var titleText = document.getElementById('titleText');

        var btnBox = document.getElementById('btnBox');

        var yesScale = 1;
        var clickCount = 0;
        var MAX_SCALE = 2.5;

        var yesTexts = ['可以', '真的不可以吗？', '再想想吧~', '你忍心拒绝我吗？', '我就当你说好啦！'];
        var noTexts = ['不可以', '再想想？', '真的不行？', '别拒绝我嘛~', '那我不听~'];

        // 触摸友好的事件绑定
        function bindBtn(el, fn) {
            var moved = false;
            el.addEventListener('touchstart', function () { moved = false; }, { passive: true });
            el.addEventListener('touchmove', function () { moved = true; }, { passive: true });
            el.addEventListener('touchend', function (e) {
                if (!moved) { e.preventDefault(); fn(); }
            });
            el.addEventListener('click', function () { fn(); });
        }

        // 放大"可以"按钮
        function growYes() {
            if (yesScale >= MAX_SCALE) return;

            yesScale = Math.min(yesScale * 1.22, MAX_SCALE);
            clickCount = Math.min(clickCount + 1, yesTexts.length - 1);

            // 动态调整宽度
            var vw = window.innerWidth;
            var currentW = yesBtn.getBoundingClientRect().width || 180;
            var newW = Math.min(currentW * 1.22, vw * 0.82);
            yesBtn.style.width = newW + 'px';
            yesBtn.style.maxWidth = 'none';
            yesBtn.style.transform = '';

            // 增大高度
            var newH = Math.min(70 + clickCount * 8, 100);
            yesBtn.style.height = newH + 'px';
            yesBtn.style.fontSize = Math.min(24 + clickCount * 2, 32) + 'px';

            // 更新文字
            yesBtn.textContent = yesTexts[clickCount];
            noBtn.textContent = noTexts[clickCount];

            // 抖动拒绝按钮
            noBtn.style.animation = 'none';
            void noBtn.offsetWidth;
            noBtn.style.animation = 'shakeAnim 0.4s ease';

            if (yesScale >= MAX_SCALE) {
                showSuccess();
            }
        }

        bindBtn(yesBtn, function () {
            if (yesScale >= MAX_SCALE) {
                showSuccess();
            } else {
                growYes();
            }
        });

        bindBtn(noBtn, function () {
            growYes();
        });

        // ===== 显示成功页 =====
        function showSuccess() {
            playMusic();

            mainPage.style.opacity = '0';
            mainPage.style.pointerEvents = 'none';

            setTimeout(function () {
                mainPage.style.display = 'none';
                successPage.style.display = 'flex';

                void successPage.offsetWidth;
                successPage.style.opacity = '1';

                // 创建飘落爱心（铺满全屏，但在图片后面）
                createHearts();
            }, 300);
        }

        // ===== 爱心飘落（z-index: 1，在图片后面） =====
        function createHearts() {
            var heartEmojis = ['💗', '💕', '❤️', '💖', '💘', '♥', '❣️', '💝', '💓'];

            // 淡粉大爱心（背景层）— 一开始就铺满
            for (var i = 0; i < 30; i++) {
                var h = document.createElement('div');
                h.className = 'heart pink';
                h.textContent = '♡';
                var size = 70 + Math.random() * 110;
                h.style.left = (Math.random() * 100) + 'vw';
                h.style.bottom = (-20 + Math.random() * 110) + 'vh';
                h.style.fontSize = size + 'px';
                h.style.animationDuration = (8 + Math.random() * 12) + 's';
                h.style.animationDelay = (Math.random() * 14) + 's';
                h.style.color = 'rgba(255,' + (170 + Math.random() * 60 | 0) + ',' + (180 + Math.random() * 55 | 0) + ',' + (0.15 + Math.random() * 0.25).toFixed(2) + ')';
                document.body.appendChild(h);

                (function (el) {
                    setTimeout(function () { el.remove(); createOneHeart('pink'); }, 22000);
                })(h);
            }

            // 红色爱心（前景层）— 一开始就铺满
            for (var j = 0; j < 25; j++) {
                var rh = document.createElement('div');
                rh.className = 'heart red';
                rh.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                var rs = 20 + Math.random() * 44;
                rh.style.left = (Math.random() * 100) + 'vw';
                rh.style.bottom = (-20 + Math.random() * 110) + 'vh';
                rh.style.fontSize = rs + 'px';
                rh.style.animationDuration = (5 + Math.random() * 10) + 's';
                rh.style.animationDelay = (Math.random() * 14) + 's';
                rh.style.color = 'hsl(' + (340 + Math.random() * 30 | 0) + ',' + (70 + Math.random() * 30 | 0) + '%,' + (45 + Math.random() * 25 | 0) + '%)';
                document.body.appendChild(rh);

                (function (el) {
                    setTimeout(function () { el.remove(); createOneHeart('red'); }, 16000);
                })(rh);
            }
        }

        // 创建单个爱心（循环补充）
        function createOneHeart(type) {
            var heartEmojis = ['💗', '💕', '❤️', '💖', '💘', '♥', '❣️', '💝', '💓'];
            var h;
            if (type === 'pink') {
                h = document.createElement('div');
                h.className = 'heart pink';
                h.textContent = '♡';
                var size = 70 + Math.random() * 110;
                h.style.left = (Math.random() * 100) + 'vw';
                h.style.bottom = '-20px';
                h.style.fontSize = size + 'px';
                h.style.animationDuration = (8 + Math.random() * 12) + 's';
                h.style.color = 'rgba(255,' + (170 + Math.random() * 60 | 0) + ',' + (180 + Math.random() * 55 | 0) + ',' + (0.15 + Math.random() * 0.25).toFixed(2) + ')';
                document.body.appendChild(h);
                setTimeout(function () { h.remove(); createOneHeart('pink'); }, 22000);
            } else {
                h = document.createElement('div');
                h.className = 'heart red';
                h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                var rs = 20 + Math.random() * 44;
                h.style.left = (Math.random() * 100) + 'vw';
                h.style.bottom = '-20px';
                h.style.fontSize = rs + 'px';
                h.style.animationDuration = (5 + Math.random() * 10) + 's';
                h.style.color = 'hsl(' + (340 + Math.random() * 30 | 0) + ',' + (70 + Math.random() * 30 | 0) + '%,' + (45 + Math.random() * 25 | 0) + '%)';
                document.body.appendChild(h);
                setTimeout(function () { h.remove(); createOneHeart('red'); }, 16000);
            }
        }

        // shake 动画
        var shakeStyle = document.createElement('style');
        shakeStyle.textContent = '@keyframes shakeAnim{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}';
        document.head.appendChild(shakeStyle);

    })();
    </script>

</body>

</html>
